# Bank-wide security standards and the controls under each.
# Owned by the security standards team. Same for every app.
# Per-app settings (tier, paths, data classification, exceptions) live in each app repo under controls/config/.
#
# Levels:
#   framework rule  -> external requirement (PCI-DSS, ISO 27001, RBI CSF)
#   standard        -> internal rule, what must be true            (STD-CRYPTO-02)
#   control         -> one testable safeguard that makes it true   (STD-CRYPTO-02.a)
#
# method:
#   behaviour_test    agent writes a pytest that runs the feature and checks the result
#   scanner           existing tool (gitleaks, osv-scanner)
#   code_rule         semgrep rule on code structure
#   outside_evidence  cannot be checked from the repo; evidence comes from another team

version: 1

standards:
  - id: STD-CRYPTO-01
    title: Encryption in transit
    text: All outbound traffic uses TLS 1.2 or higher. No plain-HTTP endpoints, no disabled certificate checks.
    severity: high
    framework_rules: [PCI-4.1, ISO-A.8.24, RBI-C.1.1]
    controls:
      - id: STD-CRYPTO-01.a
        text: No outbound call uses an http:// URL or disables certificate verification.
        method: code_rule
        rule: tls-outbound

  - id: STD-CRYPTO-02
    title: Card data protection
    text: >
      Card numbers (PAN) are tokenized or encrypted wherever stored, shown only as the
      last 4 digits wherever displayed, and never written to logs.
    severity: critical
    framework_rules: [PCI-3.4, PCI-3.5, ISO-A.8.24, RBI-C.1.1]
    controls:
      - id: STD-CRYPTO-02.a
        text: No full card number is stored in any database table.
        method: behaviour_test
        test_hint: >
          Send a known test PAN through every API that accepts card data. Then read every
          value in every table (db.all_values()) and assert none is a Luhn-valid 13-19 digit number.
      - id: STD-CRYPTO-02.b
        text: API responses show at most the last 4 digits of a card number.
        method: behaviour_test
        test_hint: Call every endpoint that returns the resource. Assert no full PAN in the body (find_pans) and last 4 present.
      - id: STD-CRYPTO-02.c
        text: Card numbers are never written to application logs.
        method: behaviour_test
        test_hint: Use caplog at INFO level around every card-accepting call. Assert find_pans(caplog.text) is empty.
      - id: STD-CRYPTO-02.d
        text: Encryption keys are held in the enterprise KMS, not in the repo.
        method: outside_evidence

  - id: STD-SEC-01
    title: No hardcoded secrets
    text: Credentials, tokens and keys are loaded at runtime from the secrets vault. None in source, config or images.
    severity: critical
    framework_rules: [PCI-6.2, ISO-A.5.17]
    controls:
      - id: STD-SEC-01.a
        text: No secrets in the repository.
        method: scanner
        scanner: gitleaks

  - id: STD-AC-01
    title: Access scoped to the owner
    text: Users and merchants can read and change only their own records.
    severity: critical
    framework_rules: [PCI-7.2, ISO-A.5.15, RBI-C.2.1]
    controls:
      - id: STD-AC-01.a
        text: A merchant cannot read or change another merchant's records.
        method: behaviour_test
        test_hint: >
          Create the resource as merchant beta. Access it as merchant alpha through every
          read/update endpoint. Expect 403 or 404, and no data from beta in the response.

  - id: STD-AC-02
    title: Strong authentication for admin and high-risk actions
    text: >
      Admin login and high-risk actions require multi-factor authentication using an
      authenticator app (TOTP) or a security key (WebAuthn). One-time codes sent by email
      or SMS do not satisfy this control.
    severity: critical
    framework_rules: [PCI-8.4, ISO-A.5.17, RBI-C.2.1]
    controls:
      - id: STD-AC-02.a
        text: An admin session can only be created after a TOTP or WebAuthn check. Email or SMS codes never complete admin login.
        method: behaviour_test
        test_hint: >
          Log in as admin with the correct password. Try to finish login with every second
          factor the app offers (including codes found in captured_emails). Only TOTP or
          WebAuthn may produce an admin session; an emailed code must get 401/403.
      - id: STD-AC-02.b
        text: Admin endpoints reject requests without a valid admin session.
        method: behaviour_test
        test_hint: Call every admin endpoint with no session and with a made-up session. Expect 401/403.

  - id: STD-LOG-01
    title: Audit trail for sensitive reads
    text: Every read of card or personal data writes an audit record with actor, action, resource and time.
    severity: high
    framework_rules: [PCI-10.2, ISO-A.8.15, RBI-C.3.1]
    controls:
      - id: STD-LOG-01.a
        text: Every endpoint that returns card or personal data writes an audit record naming the actor and resource.
        method: behaviour_test
        test_hint: Call each read endpoint, then query audit_log (db.rows) for a row with the caller as actor and the resource id.

  - id: STD-LOG-02
    title: Central, tamper-evident logs
    text: Security logs are shipped to central storage that cannot be edited, retained for one year.
    severity: high
    framework_rules: [PCI-10.3, ISO-A.8.15, RBI-C.3.1]
    controls:
      - id: STD-LOG-02.a
        text: Logs are stored centrally with write-once retention.
        method: outside_evidence

  - id: STD-SDLC-01
    title: Server-side input validation
    text: All external input is validated on the server before use.
    severity: medium
    framework_rules: [PCI-6.2, ISO-A.8.28]
    controls:
      - id: STD-SDLC-01.a
        text: Every endpoint rejects malformed input with 422 and stores nothing.
        method: behaviour_test
        test_hint: For each write endpoint send malformed values (wrong types, out-of-range, non-digit card numbers). Expect 422 and no new rows.

  - id: STD-SDLC-02
    title: No known-vulnerable dependencies
    text: Builds do not ship dependencies with known critical or high CVEs.
    severity: high
    framework_rules: [PCI-6.3, RBI-C.4.1]
    controls:
      - id: STD-SDLC-02.a
        text: No dependency in requirements.txt has a known critical or high vulnerability.
        method: scanner
        scanner: osv-scanner

  - id: STD-DP-01
    title: Data minimisation and retention
    text: Only data needed for the stated purpose is collected, and it is deleted at the end of its retention period.
    severity: medium
    framework_rules: [ISO-A.5.34, RBI-C.1.1]
    controls:
      - id: STD-DP-01.a
        text: APIs do not return personal data fields that the caller does not need.
        method: behaviour_test
        test_hint: For each read endpoint, compare returned fields against the documented response; no extra personal fields (email, phone, full name) beyond what is required.
      - id: STD-DP-01.b
        text: Data is deleted after its retention period.
        method: outside_evidence
